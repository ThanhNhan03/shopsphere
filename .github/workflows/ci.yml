name: Build and test
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build ShopSphere.sln -c Release
      - run: dotnet test ShopSphere.sln -c Release --no-build
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shopsphere-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/shopsphere-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
